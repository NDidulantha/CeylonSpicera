services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage/app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ceylon_spicera}
      POSTGRES_USER: ${DB_USERNAME:-ceylon}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ceylon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  storage_data:
  caddy_data:
  caddy_config:
