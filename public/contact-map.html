<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { margin: 0; height: 100%; background: #EFE8D8; }
        #map { width: 100%; height: 100%; }
        .pin { display: flex; flex-direction: column; align-items: center; transform: translateY(-4px); }
        .pin .dot {
            position: relative;
            width: 22px; height: 22px;
            border-radius: 50% 50% 50% 0;
            background: #7c1f16;
            border: 2px solid #F7F3EA;
            transform: rotate(-45deg);
            box-shadow: 0 4px 10px rgba(0,0,0,.35);
        }
        .pin .dot::after {
            content: ""; position: absolute; top: 6px; left: 6px;
            width: 6px; height: 6px; border-radius: 50%; background: #F7F3EA;
        }
        .leaflet-popup-content-wrapper { border-radius: 6px; }
        .shop-pop strong { font-family: Georgia, 'Times New Roman', serif; color: #1F3A2A; }
        .shop-pop span { display: block; font-size: 12px; color: #6F6558; margin-top: 2px; }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const shop = [6.9110, 79.8650]; // Cinnamon Gardens, Colombo 07
    const map = L.map('map', { scrollWheelZoom: false, zoomControl: true }).setView(shop, 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19, subdomains: 'abcd'
    }).addTo(map);
    const icon = L.divIcon({
        className: '',
        html: '<div class="pin"><div class="dot"></div></div>',
        iconSize: [22, 22], iconAnchor: [11, 22], popupAnchor: [0, -22]
    });
    L.marker(shop, { icon }).addTo(map)
        .bindPopup('<div class="shop-pop"><strong>The Colombo Spice House</strong><span>No. 12, Cinnamon Gardens</span><span>Colombo 07, Sri Lanka</span></div>')
        .openPopup();
</script>
</body>
</html>
